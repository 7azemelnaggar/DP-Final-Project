  uploader:
    image: python:3.11-slim
    container_name: hdfs-uploader
    working_dir: /app
    volumes:
      - ./:/app
    depends_on:
      - namenode
      - datanode1
      - datanode2
      - datanode3
      - datanode4
      - datanode5
      - datanode6
      - datanode7
      - datanode8
      - datanode9
      - datanode10
    command: tail -f /dev/null

  booking-service:
    image: python:3.11-slim
    container_name: booking-service
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "5000:5000"
    environment:
      - HOST=0.0.0.0
      - PORT=5000
      - BOOKING_HDFS_URL=http://namenode:9870
      - BOOKING_HDFS_USER=root
      - BOOKING_HDFS_CHANGE_LOG_PATH=/data/raw/booking_changes.csv
    depends_on:
      - namenode
    command: sh -c "pip install -r requirements.txt && python booking_service/app.py"

volumes:
  namenode:
  datanode1:
